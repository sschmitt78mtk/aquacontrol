schema: spec-driven

context: |
  AquaControl is a Python/FastAPI port of an ESP8266 aquarium controller for Raspberry Pi Zero.
  Stack: Python 3.12, FastAPI + uvicorn, Pydantic v2, python-dotenv, pickle persistence,
  stdlib smtplib (SMTP_SSL), DS18B20 via 1-Wire sysfs, gpiozero/RPi.GPIO behind a mockable
  GPIOController, plain static HTML/JS (German UI), pytest.
  Conventions: modules in app/, singleton factories (get_settings/get_crud/get_gpio),
  dataclasses internally + Pydantic at the API, [TAG]-prefixed logging, active-LOW relays,
  10-bit PWM (0-1023), preserve ESP8266 names/routes/edge cases, hardware must stay mockable,
  keep the ~1s background loop cheap (Pi Zero). Tests: pytest with MockGPIOController and
  unittest.mock patches; keep `python -m pytest tests/ -v` green.

