<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temperaturverlauf</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        h1 { color: #2c3e50; }
        #graph {
            position: relative;
            width: 100%;
        }
        #graph svg {
            width: 100%;
            max-width: 90vw;
            max-height: 70vh;
            font-family: Arial, sans-serif;
            /* Allow the browser to pinch-zoom (two fingers) while we still
               control single-finger scrubbing via preventDefault() in the
               non-passive touchmove listener. */
            touch-action: pinch-zoom;
        }

        .error {
            color: #d32f2f;
            padding: 1rem;
            border: 1px solid #ffcdd2;
            background: #ffebee;
        }
        #graph:hover::after {
            content: "Rechtsklick zum Speichern";
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 5px;
            font-size: 0.8em;
            border-radius: 3px;
        }

        /* Save button (primary mobile save path) */
        #saveSvgBtn {
            display: inline-block;
            margin: 12px 0;
            padding: 10px 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        #saveSvgBtn:hover { background: #43A047; }
        #saveSvgBtn:active { background: #388E3C; }

        /* Tab-Navigation aus dem Original */
        .tab-navigation { margin-top: 30px; }
        .tab-container { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
        .tab-item { margin: 0; }
        .tab-link {
            display: block;
            padding: 8px 14px;
            background: #e0e0e0;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .tab-link:hover { background: #4CAF50; color: white; }
        .tab-link.active { background: #2196F3; color: white; }

        /* Schmalere Mobil-Geräte: weniger Rand, mehr Platz für den Graphen */
        @media (max-width: 600px) {
            body { margin: 10px; }
            h1 { font-size: 1.4em; }
            #graph svg { max-width: 100vw; }
        }
    </style>
</head>
<body>
    <h1>Temperaturverlauf V4 RPi</h1>
    <div id="graph" class="graph"></div>
    <button id="saveSvgBtn" type="button">💾 Grafik speichern (SVG)</button>
    <nav class="tab-navigation">
        <ul class="tab-container">
            <li class="tab-item">
                <a href="/schedule" class="tab-link">Zeitschaltuhr</a>
            </li>
            <li class="tab-item">
                <a href="/light" class="tab-link">Licht Direkt schalten</a>
            </li>
            <li class="tab-item">
                <a href="/email" class="tab-link">Email abschicken</a>
            </li>
            <li class="tab-item">
                <a href="/info" class="tab-link active">Temperaturverlauf</a>
            </li>
            <li class="tab-item">
                <a href="/api/temperature/csv" class="tab-link">CSV download</a>
            </li>
            <li class="tab-item">
                <a href="/settings" class="tab-link">Einstellungen</a>
            </li>
            <li class="tab-item">
                <a href="/ram" class="tab-link">RAM-Info</a>
            </li>
        </ul>
    </nav>
    <script>
        async function loadAndDrawGraph() {
        // CSV-Daten laden
        const response = await fetch('/api/temperature/csv');
        if (!response.ok) throw new Error(`HTTP-Error: ${response.status}`);
        const csvData = await response.text();

        // Daten aufbereiten
        const rows = csvData.split('\n').filter(row => row.trim() !== '');
        const header = rows.shift();
        
        // Daten parsen
        const data = rows.map((row, index) => {
            try {
                const [timestamp, tempStr] = row.split(';');
                const temp = parseFloat(tempStr.replace(',', '.').replace(/[^0-9.-]/g, ''));
                
                // Überprüfe Temperaturbereich
                if (temp < 15 || temp > 35) {
                    console.warn(`Zeile ${index + 1}: Temperatur ${temp}°C außerhalb des gültigen Bereichs (15-35°C)`);
                    return null;
                }
                
                return { timestamp, temp };
            } catch (e) {
                console.error(`Fehler beim Parsen von Zeile ${index + 1}:`, row);
                return null;
            }
        }).filter(d => d !== null);

        if (data.length < 2) {
            showError('Mindestens 2 Datenpunkte benötigt');
            return;
        }

        // Daten chronologisch sortieren
        data.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        // SVG-Elemente
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const margin = 40;
        const width = 800;
        const height = 400;
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.innerHTML = `<rect width="100%" height="100%" fill="#fafafa"/>`;

        // Skalierung berechnen
        const temps = data.map(d => d.temp);
        const minTemp = Math.floor(Math.min(...temps));
        const maxTemp = Math.ceil(Math.max(...temps));
        const tempRange = maxTemp - minTemp;
        const yScale = (height - 2 * margin) / tempRange;
        const xStep = (width - 2 * margin) / (data.length - 1);

        // Hilfslinien (Y-Achse)
        for (let t = minTemp; t <= maxTemp; t += 0.5) {
            const y = height - margin - (t - minTemp) * yScale;
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            line.setAttribute('d', `M${margin},${y} H${width - margin}`);
            line.setAttribute('stroke', t % 1 === 0 ? '#e0e0e0' : '#f0f0f0');
            line.setAttribute('stroke-width', '0.5');
            svg.appendChild(line);
        }

        // Tageswechsel erkennen und markieren
        const dayMarkers = [];
        let currentDay = null;
        const dateFormatOptions = { day: '2-digit', month: '2-digit' };

        data.forEach((d, i) => {
            const date = new Date(d.timestamp);
            const day = date.toISOString().split('T')[0];
            
            if (day !== currentDay) {
                currentDay = day;
                dayMarkers.push({
                    index: i,
                    date: date,
                    xPos: margin + i * xStep
                });
            }
        });

        // Vertikale Linien und Beschriftungen zeichnen
        const drawnDays = new Set();
        dayMarkers.forEach(marker => {
            const dateStr = marker.date.toLocaleDateString('de-DE', dateFormatOptions).replace(/\./g, '/');
            
            if (!drawnDays.has(dateStr)) {
                // Vertikale Linie
                const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                vLine.setAttribute('x1', marker.xPos);
                vLine.setAttribute('y1', height - margin);
                vLine.setAttribute('x2', marker.xPos);
                vLine.setAttribute('y2', margin);
                vLine.setAttribute('stroke', '#e0e0e0');
                vLine.setAttribute('stroke-dasharray', '2,2');
                svg.appendChild(vLine);

                // Beschriftung
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute('x', marker.xPos);
                text.setAttribute('y', height - margin + 18);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '10');
                text.setAttribute('fill', '#666');
                text.textContent = dateStr;
                svg.appendChild(text);

                drawnDays.add(dateStr);
            }
        });

        // Y-Achsen-Beschriftung
        for (let t = minTemp; t <= maxTemp; t++) {
            const y = height - margin - (t - minTemp) * yScale;
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x', margin - 5);
            text.setAttribute('y', y + 3);
            text.setAttribute('text-anchor', 'end');
            text.setAttribute('font-size', '10');
            text.textContent = `${t}°`;
            svg.appendChild(text);
        }

        // Achsen zeichnen
        const drawPath = (d, stroke) => {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute('d', d);
            path.setAttribute('stroke', stroke);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-width', '1');
            svg.appendChild(path);
        };

        // X- und Y-Achse
        drawPath(`M${margin},${height - margin} H${width - margin}`, '#333');
        drawPath(`M${margin},${height - margin} V${margin}`, '#333');

        // Temperaturkurve
        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        const points = data.map((d, i) => 
            `${margin + i * xStep},${height - margin - (d.temp - minTemp) * yScale}`
        ).join(' ');
        
        polyline.setAttribute('points', points);
        polyline.setAttribute('stroke', '#2196f3');
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke-width', '2');
        svg.appendChild(polyline);

        // Aktuelle Temperatur-Annotation
        const last = data[data.length - 1];
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute('x', width - margin);
        text.setAttribute('y', margin + 15);
        text.setAttribute('text-anchor', 'end');
        text.setAttribute('font-size', '12');
        text.textContent = `Aktuell: ${last.temp.toFixed(1)}°C`;
        svg.appendChild(text);

        const highlight = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        highlight.setAttribute("r", 6);
        highlight.setAttribute("fill", "red");
        highlight.setAttribute("stroke", "white");
        highlight.setAttribute("stroke-width", "2");
        highlight.style.display = "none"; // erstmal unsichtbar
        svg.appendChild(highlight);

        // Graph einfügen
        const container = document.getElementById('graph');
        container.innerHTML = '';
        container.appendChild(svg);
		const tooltip = document.createElement('div');
        tooltip.style.cssText = `
            position: absolute;
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 14px;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        `;
        document.getElementById('graph').appendChild(tooltip);

        // Hilfsfunktion: Tooltip an Bildschirmposition anzeigen.
        // clientX/clientY sind Viewport-Koordinaten; der Tooltip wird relativ
        // zu #graph positioniert, daher wird der Container-Offset abgezogen.
        // Fuer Touch wird der Tooltip oberhalb des Fingers platziert (damit er
        // nicht verdeckt ist) und nach unten geklappt, wenn der Punkt zu nah
        // am oberen Rand liegt.
        const TOOLTIP_OFFSET = 18; // Abstand vom Touch-/Mauspunkt
        const TOOLTIP_EST_HEIGHT = 32; // geschaetzte Tooltip-Hoehe inkl. Padding

        function showTooltipAt(clientX, clientY, isTouch) {
            const rect = svg.getBoundingClientRect();
            const scaleX = width / rect.width;
            const scaleY = height / rect.height;
            const viewBoxX = (clientX - rect.left) * scaleX;
            const viewBoxY = (clientY - rect.top) * scaleY;
            const x = viewBoxX - margin;
            const y = viewBoxY;

            // Nur innerhalb des Diagrammbereichs
            if(x < 0 || x > (width - 2*margin) || y < margin || y > (height - margin)) {
                tooltip.style.opacity = '0';
                highlight.style.display = "none";
                return;
            }

            // Datenindex berechnen
            const index = Math.round(x / xStep);
            if(index < 0 || index >= data.length) return;

            // Koordinaten des Punktes berechnen
            const pointX = margin + index * xStep;
            const pointY = height - margin - (data[index].temp - minTemp) * yScale;

            // Highlight-Kreis verschieben und sichtbar machen
            highlight.setAttribute("cx", pointX);
            highlight.setAttribute("cy", pointY);
            highlight.style.display = "block";

            // Uhrzeit formatieren
            const date = new Date(data[index].timestamp);
            const timeStr = date.toLocaleTimeString('de-DE', { 
                hour: '2-digit', 
                minute: '2-digit'
            });

            // Tooltip anzeigen
            tooltip.style.opacity = '1';
            tooltip.textContent = `${timeStr} Uhr - ${data[index].temp.toFixed(1)}°C`;

            // Position relativ zum #graph-Container berechnen
            const containerRect = document.getElementById('graph').getBoundingClientRect();
            let relX = clientX - containerRect.left;
            let relY = clientY - containerRect.top;

            if (isTouch) {
                // Bei Touch: Tooltip oberhalb des Fingers platzieren,
                // damit der Text nicht vom Finger verdeckt wird.
                relY = relY - TOOLTIP_OFFSET - TOOLTIP_EST_HEIGHT;
                if (relY < 0) {
                    // Zu nah am oberen Rand -> unter den Finger klappen
                    relY = (clientY - containerRect.top) + TOOLTIP_OFFSET;
                }
                relX = relX + 10; // leicht nach rechts versetzt
            } else {
                // Maus: wie bisher leicht nach unten/rechts versetzt
                relX = relX + 10;
                relY = relY + 10;
            }

            // Verhindern, dass der Tooltip rechts aus dem Container herausragt
            const containerWidth = containerRect.width;
            const estWidth = tooltip.textContent.length * 7 + 20;
            if (relX + estWidth > containerWidth) {
                relX = containerWidth - estWidth - 4;
            }
            if (relX < 4) relX = 4;

            tooltip.style.left = `${relX}px`;
            tooltip.style.top = `${relY}px`;
        }

        function hideTooltip() {
            tooltip.style.opacity = '0';
            highlight.style.display = "none";
        }

        // Mausbewegung verfolgen
        svg.addEventListener('mousemove', (e) => {
            showTooltipAt(e.clientX, e.clientY, false);
        });

        svg.addEventListener('mouseleave', () => {
            hideTooltip();
        });

        // Touch-Events für mobile Geräte.
        // Wir unterdruecken das Standardverhalten (Seite scrollen)
        // NUR bei Ein-Finger-Touchmove, damit der Tooltip der Fingerbewegung
        // folgen kann, ohne dass die Seite wegspringt.
        // Bei Zwei-Finger-Touch (Pinch-Zoom) lassen wir den Browser zoomen.
        svg.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                showTooltipAt(touch.clientX, touch.clientY, true);
            } else {
                // Mehrere Finger -> Zoom-Modus, Tooltip ausblenden
                hideTooltip();
            }
        }, { passive: true });

        svg.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                // Ein Finger: Tooltip-Scrubbing, Seite nicht scrollen
                e.preventDefault();
                const touch = e.touches[0];
                showTooltipAt(touch.clientX, touch.clientY, true);
            } else {
                // Zwei Finger: Browser-Zoom zulassen, Tooltip ausblenden
                hideTooltip();
            }
        }, { passive: false });

        svg.addEventListener('touchend', () => {
            // Tooltip sichtbar lassen, damit der Nutzer den Finger heben
            // und den Wert ablesen kann. Versteckt wird beim naechsten
            // touchstart (Ein-Finger) oder beim Verlassen des Elements.
        });

        svg.addEventListener('touchcancel', () => {
            hideTooltip();
        });
    }

        function showError(msg) {
            const div = document.getElementById('graph');
            div.innerHTML = `<div style="color:red; padding:20px">${msg}</div>`;
        }

        // Automatisch ausführen
        loadAndDrawGraph().catch(error => showError('Fehler beim Laden der Temperaturdaten: ' + error.message));
		
        // SVG-Grafik als Datei speichern (wird vom Button und vom
        // Rechtsklick genutzt).
        function saveSvg() {
            const svgElement = document.getElementById('graph').querySelector('svg');
            if (!svgElement) return;

            // SVG als String mit korrektem Namespace
            const svgString = new XMLSerializer().serializeToString(svgElement);
            const blob = new Blob([svgString], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);

            // Temporaeren Download-Link erstellen
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'temperatur-grafik.svg';
            document.body.appendChild(a);
            a.click();

            // Aufraeumen
            URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // Speichern-Button (primaerer Speicherpfad, auch auf Mobil)
        document.getElementById('saveSvgBtn').addEventListener('click', saveSvg);

        // Event-Listener fuer Rechtsklick (Desktop-Komfort)
        document.getElementById('graph').addEventListener('contextmenu', function(e) {
            e.preventDefault();
            saveSvg();
        });

    </script>
</body>
</html>
